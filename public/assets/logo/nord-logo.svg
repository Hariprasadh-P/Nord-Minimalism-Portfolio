<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200" width="100%" height="100%">
  <defs>
    <style>
      .brand-text {
        font-family: 'Cinzel', 'Playfair Display', Georgia, serif;
        font-weight: 600;
        fill: #22092C;
        letter-spacing: 0.18em;
      }
      .sub-text {
        font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
        font-size: 19px;
        font-weight: 500;
        letter-spacing: 0.52em;
        fill: #22092C;
      }
      .compass-line {
        stroke: #22092C;
        stroke-width: 2.2;
        fill: none;
      }
      .compass-star-fill {
        fill: #22092C;
      }
    </style>
  </defs>

  <!-- NORD Main typography with compass star embedded in O -->
  <g transform="translate(40, 20)">
    <!-- N -->
    <text x="5" y="85" font-size="82" class="brand-text">N</text>
    
    <!-- Compass O -->
    <g transform="translate(138, 55)">
      <!-- Outer circle -->
      <circle cx="0" cy="0" r="34" class="compass-line" />
      <circle cx="0" cy="0" r="28" stroke="#22092C" stroke-width="0.8" stroke-dasharray="2 3" fill="none" opacity="0.6"/>
      
      <!-- 8-Point Compass Star -->
      <!-- Main North Point -->
      <polygon points="0,-48 4,-12 0,-4 -4,-12" class="compass-star-fill" />
      <!-- Main South Point -->
      <polygon points="0,48 4,12 0,4 -4,12" class="compass-star-fill" />
      <!-- Main East Point -->
      <polygon points="48,0 12,4 4,0 12,-4" class="compass-star-fill" />
      <!-- Main West Point -->
      <polygon points="-48,0 -12,4 -4,0 -12,-4" class="compass-star-fill" />
      
      <!-- Diagonal NE Point -->
      <polygon points="26,-26 8,-4 0,0 4,-8" class="compass-star-fill" opacity="0.85" />
      <!-- Diagonal SE Point -->
      <polygon points="26,26 8,4 0,0 4,8" class="compass-star-fill" opacity="0.85" />
      <!-- Diagonal SW Point -->
      <polygon points="-26,26 -8,4 0,0 -4,8" class="compass-star-fill" opacity="0.85" />
      <!-- Diagonal NW Point -->
      <polygon points="-26,-26 -8,-4 0,0 -4,-8" class="compass-star-fill" opacity="0.85" />

      <!-- Center tiny dot -->
      <circle cx="0" cy="0" r="2.5" fill="#FAF7F2"/>
    </g>

    <!-- R -->
    <text x="180" y="85" font-size="82" class="brand-text">R</text>
    
    <!-- D -->
    <text x="250" y="85" font-size="82" class="brand-text">D</text>

    <!-- MEDIA HOUSE Subtitle -->
    <text x="3" y="132" class="sub-text">MEDIA HOUSE</text>
  </g>
</svg>
